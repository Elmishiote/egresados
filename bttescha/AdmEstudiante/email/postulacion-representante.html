<!DOCTYPE html>
<html lang="es-MX">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Postulación recibida</title>
        <style>
            body {
                margin: 0;
                font-family: var(--bs-body-font-family);
                font-size: var(--bs-body-font-size);
                font-weight: var(--bs-body-font-weight);
                line-height: var(--bs-body-line-height);
                color: var(--bs-body-color);
                text-align: var(--bs-body-text-align);
                background-color: var(--bs-body-bg);
                -webkit-text-size-adjust: 100%;
                -webkit-tap-highlight-color: transparent;
            }

            *,
            ::after,
            ::before {
                box-sizing: border-box;
                font-family: system-ui, sans-serif;
            }

            footer {
                padding-left: 1em;
                padding-right: 1em;
            }
            .fw-bold {
                font-weight: bold;
            }

            .fa-circle-check {
                color: #00ac00;
            }

            .container {
                --bs-gutter-x: 1.5rem;
                --bs-gutter-y: 0;
                width: 100%;
                padding-right: calc(var(--bs-gutter-x) * 0.5);
                padding-left: calc(var(--bs-gutter-x) * 0.5);
                margin-right: auto;
                margin-left: auto;
            }

            .postulacion {
                display: flex;
                align-items: center;
            }

            h1 {
                font-size: calc(1.375rem + 1.5vw);
            }

            h3 {
                font-size: calc(1.3rem + 0.6vw);
            }

            h1,
            h2,
            h3,
            h4,
            h5,
            h6 {
                margin-top: 0;
                margin-bottom: 0.5rem;
                font-weight: 500;
                line-height: 1.2;
                color: var(--bs-heading-color);
            }

            .bg-primary {
                background-color: #0d6efd;
            }

            .bg-body-secondary {
                background-color: #e9ecef;
            }

            .text-center {
                text-align: center;
            }

            .px-5 {
                padding-left: 3em;
                padding-right: 3em;
            }

            .py-5 {
                padding-top: 3em;
                padding-bottom: 3em;
            }

            .m-0 {
                margin: 0;
            }

            .mb-2 {
                margin-bottom: 0.5em;
            }

            .mb-3 {
                margin-bottom: 1em;
            }

            .mb-4 {
                margin-bottom: 1.5em;
            }

            .my-5 {
                margin-top: 3em;
                margin-bottom: 3em;
            }
        </style>
        <!-- <link rel="stylesheet" href="../../assets/css/bootstrap.min.css" /> -->
    </head>
    <body>
        <header class="bg-primary" style="height: 50px"></header>
        <div class="container px-5 my-5">
            <div class="postulacion mb-3">
                <img
                    src="cid:check"
                    alt="Check verde"
                    height="25px"
                    width="25px"
                    style="margin-right: 0.5em" />
                <h3>Nueva postulacion recibida</h3>
            </div>

            <h1 class="fw-bold mb-2">{nombre_vacante}</h1>
            <h4 class="fw-bold text-secondary mb-4">{nombre_empresa}</h4>

            <p>
                Alguien se ha postulado a tu vacante publicada. Revisa las
                postulaciones de esta vacante.
            </p>
        </div>
        <footer class="bg-body-secondary text-center py-5">
            <div class="container">
                <p class="fw-bold m-0 mb-2">
                    Seguimiento de Egresados y Bolsa de Trabajo
                </p>
                <p class="m-0">Tecnológico de Estudios Superiores de Chalco</p>
            </div>
        </footer>
    </body>
</html>
